# Keeps the guide in sync with the bot (MC-Linker/MC-Linker) and the plugin (MC-Linker/Discord-Linker).
#
# The bot and plugin repos each have .github/workflows/notify-guide.yml, which sends a
# repository_dispatch ("source-pushed") here on every push to their default branch.
# You can also start it by hand from the Actions tab (workflow_dispatch).
#
# Secrets needed in this repo (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`, uses your Claude subscription)
#     or ANTHROPIC_API_KEY   (billed per run on the API)
name: Guide auto-update

on:
  repository_dispatch:
    types: [source-pushed]
  workflow_dispatch:

# One run at a time. Each run checks everything since the last recorded state,
# so a push whose run gets replaced by a newer queued run is still covered.
concurrency:
  group: guide-auto-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the guide
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the bot
        uses: actions/checkout@v4
        with:
          repository: MC-Linker/MC-Linker
          path: _bot
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          repository: MC-Linker/Discord-Linker
          path: _plugin
          fetch-depth: 0
          persist-credentials: false

      - name: Keep the source checkouts out of git
        run: printf '_bot/\n_plugin/\n' >> .git/info/exclude

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_REPO: ${{ github.event.client_payload.repo }}
          PUSHED_BEFORE: ${{ github.event.client_payload.before }}
          PUSHED_AFTER: ${{ github.event.client_payload.after }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/guide-auto-update-prompt.md.
            This run was started by: ${{ github.event_name }}.
            Pushed repo: ${{ github.event.client_payload.repo || 'none (manual run)' }}
            Push range: ${{ github.event.client_payload.before || '-' }}..${{ github.event.client_payload.after || '-' }}
          claude_args: |
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(jq:*),Bash(ls:*),Bash(cat:*),Bash(date:*),Read,Edit,Write,Glob,Grep"
